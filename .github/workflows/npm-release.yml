name: npm Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:packages
      - run: pnpm --filter @zoeymind/cli typecheck
      - run: pnpm --filter @zoeymind/mcp typecheck

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify tag matches package versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${REF_NAME#v}"
          cli_version="$(node -p "require('./apps/cli/package.json').version")"
          mcp_version="$(node -p "require('./apps/mcp/package.json').version")"
          if [[ "$cli_version" != "$expected" || "$mcp_version" != "$expected" ]]; then
            echo "tag $REF_NAME does not match CLI ($cli_version) / MCP ($mcp_version) versions" >&2
            exit 1
          fi
      - run: pnpm build:packages
      - name: Publish with npm trusted publishing
        env:
          TAG: latest
        run: |
          (cd apps/cli && npm publish --provenance --access public --tag "$TAG")
          (cd apps/mcp && npm publish --provenance --access public --tag "$TAG")
