name: npm Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:packages
      - run: pnpm --filter @zoeymind/cli typecheck
      - run: pnpm --filter @zoeymind/mcp typecheck

  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Only repo owner may publish
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED: chacelow
        run: |
          if [[ "$ACTOR" != "$ALLOWED" ]]; then
            echo "actor $ACTOR is not authorized to publish; only $ALLOWED can trigger npm Release" >&2
            exit 1
          fi

  publish:
    runs-on: ubuntu-24.04
    needs: [authorize, validate]
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify version consistency
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${REF_NAME#v}"
          cli_version="$(node -p "require('./apps/cli/package.json').version")"
          mcp_version="$(node -p "require('./apps/mcp/package.json').version")"
          if [[ "$cli_version" != "$expected" || "$mcp_version" != "$expected" ]]; then
            echo "tag $REF_NAME does not match CLI ($cli_version) / MCP ($mcp_version) versions" >&2
            exit 1
          fi
      - run: pnpm build:packages
      - name: Publish with npm trusted publishing
        env:
          TAG: latest
        run: |
          publish_if_new() {
            local dir="$1"
            local pkg
            pkg="$(node -p "require('./${dir}/package.json').name")"
            local ver
            ver="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${pkg}@${ver}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${pkg}@${ver} already published, skipping"
              return 0
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$TAG")
          }
          publish_if_new apps/cli
          publish_if_new apps/mcp
