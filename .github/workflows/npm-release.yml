name: npm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact CLI and MCP version to publish, for example 0.2.0
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:packages
      - run: pnpm --filter @zoeymind/cli typecheck
      - run: pnpm --filter @zoeymind/mcp typecheck

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply and verify release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.VERSION)) process.exit(1)'
          pnpm --filter @zoeymind/cli exec npm version "$VERSION" --no-git-tag-version
          pnpm --filter @zoeymind/mcp exec npm version "$VERSION" --no-git-tag-version
      - run: pnpm build:packages
      - name: Publish with npm trusted publishing
        env:
          TAG: ${{ inputs.tag }}
        run: |
          (cd apps/cli && npm publish --provenance --access public --tag "$TAG")
          (cd apps/mcp && npm publish --provenance --access public --tag "$TAG")
