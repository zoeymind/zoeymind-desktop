name: Release

on:
  workflow_dispatch:
    inputs:
      release-ref:
        description: Commit, branch, or tag to release (defaults to main)
        required: false
        default: main
        type: string
      artifact-run-id:
        description: Successful build run to recover without rebuilding
        required: false
        type: string
      release-tag:
        description: Existing draft release tag used for recovery
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    steps:
      - name: Only repo owner may release
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED: chacelow
        run: |
          if [[ "$ACTOR" != "$ALLOWED" ]]; then
            echo "actor $ACTOR is not authorized to run Release; only $ALLOWED can dispatch" >&2
            exit 1
          fi
      - name: Validate input mode
        env:
          INPUT_ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ -n "$INPUT_ARTIFACT_RUN_ID" || -n "$INPUT_RELEASE_TAG" ]]; then
            if [[ -z "$INPUT_ARTIFACT_RUN_ID" || -z "$INPUT_RELEASE_TAG" ]]; then
              echo "recovery requires artifact-run-id and release-tag" >&2
              exit 1
            fi
          fi

  prepare:
    name: Prepare explicit release
    if: inputs.artifact-run-id == ''
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      tag-name: ${{ steps.release.outputs.tag-name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - name: Resolve version, commit, and create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          INPUT_REF: ${{ inputs.release-ref }}
        run: |
          sha="$(gh api "repos/${{ github.repository }}/commits/$INPUT_REF" --jq .sha)"
          previous_tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          if [[ ! "$previous_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "latest published tag is not SemVer: $previous_tag" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          commit_count="$(gh api "repos/${{ github.repository }}/compare/$previous_tag...$sha" --jq .total_commits)"
          if [[ ! "$commit_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "release ref must contain commits after $previous_tag, got: $commit_count" >&2
            exit 1
          fi

          version="$major.$minor.$((patch + commit_count))"
          tag="v$version"

          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi

          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/$tag" \
            -f sha="$sha" >/dev/null

          if ! release_id="$(gh api "repos/${{ github.repository }}/releases" \
            --method POST \
            -f tag_name="$tag" \
            -f target_commitish="$sha" \
            -f name="$tag" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)"; then
            gh api "repos/${{ github.repository }}/git/refs/tags/$tag" --method DELETE
            exit 1
          fi
          gh api "repos/${{ github.repository }}/releases/$release_id" \
            --method PATCH \
            -f tag_name="$tag" \
            -f target_commitish="$sha" >/dev/null

          {
            echo "tag-name=$tag"
            echo "version=$version"
            echo "sha=$sha"
            echo "release-id=$release_id"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    if: needs.prepare.result == 'success'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            bundles: nsis
            artifact-name: zoeymind-windows-x64
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
            artifact-name: zoeymind-macos-arm64
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
            artifact-name: zoeymind-macos-x64
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: appimage,deb
            artifact-name: zoeymind-linux-x64
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: runner.os != 'Linux'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact-name }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write release version override
        shell: bash
        run: |
          node -e 'require("node:fs").writeFileSync("src-tauri/tauri.release.conf.json", JSON.stringify({version: process.env.RELEASE_VERSION}))'

      - name: Require updater signing configuration
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required for reproducible signed updater payloads" >&2; exit 1; }
          : "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:=}"

      - name: Build installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Store installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete release
    if: needs.build.result == 'success'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag-name }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate categorized release notes
        run: node scripts/generate-release-notes.mjs "$RELEASE_TAG"
      - name: Download all installers
        uses: actions/download-artifact@v5
        with:
          pattern: zoeymind-*
          path: dist

      - name: Prepare release assets, manifest, and checksums
        run: |
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            case "$asset" in
              dist/zoeymind-macos-arm64/*.app.tar.gz*) name="${name/ZoeyMind/ZoeyMind-aarch64}" ;;
              dist/zoeymind-macos-x64/*.app.tar.gz*) name="${name/ZoeyMind/ZoeyMind-x64}" ;;
            esac
            if [[ -e "release-assets/$name" ]]; then
              echo "duplicate release asset after architecture naming: $name" >&2
              exit 1
            fi
            cp "$asset" "release-assets/$name"
          done < <(find dist -type f -print0)

          notes="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq 'map(select(.tag_name == env.RELEASE_TAG))[0].body // ""')"
          printf '%s' "$notes" > release-assets/.notes
          node scripts/build-updater-manifest.mjs \
            --dir release-assets \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file release-assets/.notes
          rm release-assets/.notes

          node scripts/validate-updater-manifest.mjs release-assets/latest.json

          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Upload immutable release assets
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f ! -name latest.json -print0)
          bash scripts/upload-release-assets.sh "$RELEASE_ID" "${assets[@]}"

      - name: Upload updater manifest last
        run: bash scripts/upload-release-assets.sh "$RELEASE_ID" ./release-assets/latest.json

      - name: Publish release
        run: |
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH \
            -F draft=false \
            -f make_latest=true >/dev/null

  recover:
    name: Publish existing build artifacts
    if: inputs.artifact-run-id != '' && inputs.release-tag != ''
    needs: validate
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - name: Checkout recovery tooling
        uses: actions/checkout@v4
      - name: Resolve draft release
        id: release
        run: |
          release_id="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq 'map(select(.tag_name == env.RELEASE_TAG and .draft == true))[0].id // empty')"
          if [[ -z "$release_id" ]]; then
            echo "draft release not found: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Download successful installers
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        run: |
          mkdir -p dist
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "${{ github.repository }}" \
            --pattern 'zoeymind-*' \
            --dir dist
          file_count="$(find dist -type f | wc -l | tr -d ' ')"
          if [[ "$file_count" -eq 0 ]]; then
            echo "no release artifacts downloaded from run $ARTIFACT_RUN_ID" >&2
            exit 1
          fi
          echo "downloaded $file_count release artifact files"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate categorized release notes
        run: node scripts/generate-release-notes.mjs "$RELEASE_TAG"

      - name: Prepare release assets, manifest, and checksums
        run: |
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            case "$asset" in
              dist/zoeymind-macos-arm64/*.app.tar.gz*) name="${name/ZoeyMind/ZoeyMind-aarch64}" ;;
              dist/zoeymind-macos-x64/*.app.tar.gz*) name="${name/ZoeyMind/ZoeyMind-x64}" ;;
            esac
            if [[ -e "release-assets/$name" ]]; then
              echo "duplicate release asset after architecture naming: $name" >&2
              exit 1
            fi
            cp "$asset" "release-assets/$name"
          done < <(find dist -type f -print0)

          notes="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq 'map(select(.tag_name == env.RELEASE_TAG))[0].body // ""')"
          printf '%s' "$notes" > release-assets/.notes
          node scripts/build-updater-manifest.mjs \
            --dir release-assets \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file release-assets/.notes
          rm release-assets/.notes

          node scripts/validate-updater-manifest.mjs release-assets/latest.json

          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Upload immutable release assets
        env:
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f ! -name latest.json -print0)
          bash scripts/upload-release-assets.sh "$RELEASE_ID" "${assets[@]}"

      - name: Upload updater manifest last
        env:
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
        run: bash scripts/upload-release-assets.sh "$RELEASE_ID" ./release-assets/latest.json

      - name: Publish release
        env:
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
        run: |
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH \
            -F draft=false \
            -f make_latest=true >/dev/null
